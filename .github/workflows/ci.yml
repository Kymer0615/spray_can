name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
      - name: Core regression tests
        run: scripts/test.sh
      - name: Universal app
        run: scripts/build.sh
      - name: Verify architectures and bundle
        run: |
          python3 scripts/verify-bundle.py 'build/Build/Products/Release/Spray Can.app'
      - uses: actions/upload-artifact@v4
        with:
          name: SprayCan-build-logs
          path: build/Logs/Build
